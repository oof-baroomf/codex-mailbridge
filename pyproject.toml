[project]
name = "codex-mailbridge"
version = "0.1.0"
description = "Email bridge for local Codex CLI sessions"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.41.1",
  "google-auth-oauthlib>=1.2.2",
  "markdown>=3.8",
  "tomli-w>=1.2.0",
]

[project.scripts]
codex-mailbridge = "codex_mailbridge.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
